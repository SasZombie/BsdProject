name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./master

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven' 
        cache-dependency-path: master/pom.xml

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Run Maven Tests
      run: ./mvnw clean test