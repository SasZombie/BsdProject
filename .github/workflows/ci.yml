name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./master

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL and Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server

          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER sas WITH SUPERUSER PASSWORD '1';"
          sudo -u postgres psql -c "CREATE DATABASE multisig OWNER sas;"
          sudo -u postgres psql -c "CREATE DATABASE multisig_test OWNER sas;"

          sudo sed -i 's/md5/trust/g' /etc/postgresql/*/main/pg_hba.conf
          sudo sed -i 's/scram-sha-256/trust/g' /etc/postgresql/*/main/pg_hba.conf
          sudo systemctl restart postgresql

          sudo -u postgres psql -d multisig -c "
            CREATE TYPE journal_stage AS ENUM ('PAYMENT_PENDING', 'STARTED', 'DONE', 'FAILED');
            CREATE TYPE role AS ENUM ('EMPLOYEE', 'ADMIN', 'MANAGER', 'CEO', 'CFO', 'BOARD_DIRECTOR', 'ACCOUNTANT');
            CREATE TYPE status AS ENUM ('PENDING', 'APPROVED', 'REJECTED', 'VETOED');
          "

          sudo -u postgres psql -d multisig_test -c "
            CREATE TYPE journal_stage AS ENUM ('PAYMENT_PENDING', 'STARTED', 'DONE', 'FAILED');
            CREATE TYPE role AS ENUM ('EMPLOYEE', 'ADMIN', 'MANAGER', 'CEO', 'CFO', 'BOARD_DIRECTOR', 'ACCOUNTANT');
            CREATE TYPE status AS ENUM ('PENDING', 'APPROVED', 'REJECTED', 'VETOED');
          "

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: master/pom.xml

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Package Application
        run: ./mvnw clean package

      - name: Start Application in Background
        run: |
          java -jar target/*.jar --spring.jpa.hibernate.ddl-auto=create > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for Application Health Check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is UP and ready for E2E testing!"
              exit 0
            fi
            echo "Waiting for app to initialize... ($i/30)"
            sleep 40
          done
          echo "Application failed to boot in time. Dumping logs:"
          cat app.log
          exit 1

      - name: Run Postman E2E Verification
        run: newman run src/test/resources/multisig-e2e.postman_collection.json

      - name: Stop Application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Store Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: master
          path: master/target/*.jar
          if-no-files-found: error
          retention-days: 7